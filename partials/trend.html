<!-- 인원 추이 (enrollment trend) page. Loads data/trend/<year>_<term>.json (a shared
     time axis + per-class applied/cart/enrolled/quota arrays) and draws an inline-SVG
     line chart with a hover tooltip. Built in app.js (initTrend / drawTrendChart). -->
<div class="page" data-page="trend" data-title="인원 추이">
<div class="tt-wrap trend-wrap">

  <div class="trend-head">
    <div class="tt-title">
      <h2>인원 추이 <span class="sub">Enrollment trend</span></h2>
    </div>
    <div class="trend-pick">
      <select id="trendTerm"></select>
      <div class="trend-search">
        <input id="trendClass" placeholder="강좌 검색 (이름)" autocomplete="off">
        <ul id="trendResults" class="trend-results hidden"></ul>
      </div>
      <select id="trendMetric">
        <option value="all">전체</option>
        <option value="a">신청</option>
        <option value="c">장바구니</option>
        <option value="e">수강 인원</option>
      </select>
    </div>
  </div>

  <div id="trendMsg" class="trend-msg">강좌를 선택하면 신청·장바구니 인원 추이가 표시됩니다.</div>

  <!-- 시간 구간 이동: live 파일은 최신 240개 시점만 담으므로, 그 이전 이력은
       고정 아카이브 청크(trend_..._wNNN.json)를 ◀/▶로 오가며 본다 -->
  <div id="trendWinNav" class="trend-win-nav hidden">
    <button id="trendPrev" type="button">◀ 이전 구간</button>
    <span id="trendWinLabel"></span>
    <button id="trendNext" type="button">다음 구간 ▶</button>
  </div>

  <div id="trendChartWrap" class="trend-chart-wrap hidden">
    <div class="trend-title-row">
      <div id="trendTitle" class="trend-title"></div>
      <button type="button" id="trendShare" class="wish-mini hidden" title="이 강좌의 인원 추이를 링크로 복사">링크 복사</button>
    </div>
    <div id="trendChart"></div>
    <div id="trendTip" class="trend-tip hidden"></div>
  </div>
  <div id="trendLegend" class="trend-legend hidden"></div>

  <!-- 최근 변동: the newest (live) window, independent of the window paged to above -->
  <section id="trendFeed" class="trend-feed hidden" aria-labelledby="trendFeedTitle">
    <div class="trend-feed-head">
      <h3 id="trendFeedTitle">최근 변동 <span class="sub">Recent changes</span></h3>
      <div class="trend-feed-ctl">
        <select id="trendFeedMode" aria-label="변동 종류">
          <option value="open">여석이 생긴 강좌</option>
          <option value="all">인원이 바뀐 모든 강좌</option>
        </select>
        <select id="trendFeedHours" aria-label="기간">
          <option value="3">최근 3시간</option>
          <option value="12">최근 12시간</option>
          <option value="24" selected>최근 24시간</option>
          <option value="0">최신 구간 전체</option>
        </select>
      </div>
    </div>
    <p id="trendFeedMeta" class="trend-feed-meta"></p>
    <ol id="trendFeedList" class="trend-feed-list"></ol>
  </section>

</div>
</div>
